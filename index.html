<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hive Siege — Alien Base Defense</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="intro">
  <div id="app"></div>

  <div id="sidebar">
    <div class="hud">
      <div class="stat"><span>CREDITS</span><b id="credits">0</b></div>
      <div class="stat"><span>WAVE</span><b id="wave">0</b></div>
      <div class="stat"><span>KILLS</span><b id="kills">0</b></div>
      <div class="stat wide"><span>CORE INTEGRITY</span><div class="bar"><div id="corehp"></div></div></div>
    </div>
    <button id="startWave" class="big">START WAVE 1</button>
    <div class="tabs">
      <button data-tab="build" class="active">BUILD</button>
      <button data-tab="tech">TECH</button>
    </div>
    <div id="buildList" class="cards"></div>
    <div id="techList" class="cards" hidden></div>
    <div id="infoPanel" hidden></div>
    <div id="desc"></div>
  </div>

  <div id="log"></div>
  <div id="help">LMB place / select &nbsp;·&nbsp; LMB drag select troopers &nbsp;·&nbsp; RMB drag rotate &nbsp;·&nbsp; MMB drag / WASD pan &nbsp;·&nbsp; scroll zoom &nbsp;·&nbsp; Q/E rotate &nbsp;·&nbsp; ESC cancel &nbsp;·&nbsp; M mute</div>

  <div id="overlay" hidden>
    <h1>THE CORE HAS FALLEN</h1>
    <p id="overlayStats"></p>
    <button id="restart" class="big">REBUILD</button>
  </div>

  <div id="debug" hidden>
    <h4>DEBUG</h4>
    <button id="dbgCash">Add 1000 cash</button>
    <button id="dbgMap">Change map</button>
    <button id="dbgTest">Test map (bug flood)</button>
    <button id="dbgWave">Spawn next wave</button>
    <button id="dbgBoss">Spawn boss</button>
    <small id="dbgMapName"></small>
  </div>
  <button id="mute" title="Mute / unmute (M)"></button>
  <div id="bossbar" hidden><span id="bossname">COLOSSUS</span><div class="track"><div id="bossfill"></div></div></div>
  <div id="wavebanner"><b></b><span></span></div>
  <div id="selbox"></div>
  <div id="abilities"></div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="deploy"><b>HIVE SIEGE</b><span>CLICK OR PRESS ANY KEY TO DEPLOY</span></div>
  <div id="skip">PRESS ANY KEY TO SKIP</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
