<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hive Siege — Alien Base Defense</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="intro">
  <div id="app"></div>

  <div id="sidebar">
    <div class="hud">
      <div class="stat credits"><span>CREDITS</span><b id="credits">0</b></div>
      <div class="stat"><span>WAVE</span><b id="wave">0</b></div>
      <div class="stat"><span>KILLS</span><b id="kills">0</b></div>
      <div class="stat wide" id="coreStat"><span>CORE INTEGRITY</span><em id="corepct">100%</em><div class="bar"><div id="corehp"></div></div></div>
    </div>
    <button id="startWave" class="big">START WAVE 1</button>
    <div class="tabs">
      <button data-tab="build" class="active">BUILD</button>
      <button data-tab="tech">TECH</button>
    </div>
    <div id="buildList" class="cards"></div>
    <div id="techList" class="cards" hidden></div>
    <div id="infoPanel" hidden></div>
    <div id="desc"></div>
  </div>

  <div id="dock">
  <div id="log"></div>
  <div id="debug" hidden>
    <h4>DEBUG</h4>
    <button id="dbgCash">Add 1000 cash</button>
    <button id="dbgMap">Change map</button>
    <button id="dbgTest">Test map (bug flood)</button>
    <button id="dbgWave">Spawn next wave</button>
    <button id="dbgBoss">Spawn boss</button>
    <button id="dbgSpecial">Spawn darters + spitters</button>
    <button id="dbgPerf">Performance stats</button>
    <button id="dbgWeather">Change weather</button>
    <button id="dbgSilo">Retract / deploy all</button>
    <button id="dbgCore">Core silo (cinematic test)</button>
    <small id="dbgMapName"></small>
  </div>
  <div id="help">
    <span><kbd>LMB</kbd>place / select</span><span><kbd>LMB</kbd>drag: select troopers</span><span><kbd>RMB</kbd>rotate</span>
    <span><kbd>MMB</kbd><kbd>WASD</kbd>pan</span><span><kbd>WHEEL</kbd>zoom</span><span><kbd>Q</kbd><kbd>E</kbd>turn</span>
    <span><kbd>1</kbd>-<kbd>0</kbd>call-ins</span><span><kbd>R</kbd>retract / deploy</span><span><kbd>ESC</kbd>cancel</span><span><kbd>M</kbd>mute</span>
  </div>
  </div>

  <div id="overlay" hidden>
    <small>MISSION FAILED</small>
    <h1>THE CORE HAS FALLEN</h1>
    <p id="overlayStats"></p>
    <button id="restart" class="big">REBUILD</button>
  </div>

  <button id="mute" title="Mute / unmute (M)"></button>
  <div id="bossbar" hidden><span id="bossname">COLOSSUS</span><div class="track"><div id="bossfill"></div></div></div>
  <div id="wavebanner"><b></b><span></span></div>
  <div id="strategic"><b></b><span></span></div>
  <div id="cursorhint" hidden></div>
  <div id="selbox"></div>
  <div id="abilities"></div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="deploy" hidden><small>ORBITAL COMMAND</small><b>HIVE SIEGE</b><i></i>
    <div class="maps">
      <button class="map" type="button" data-map="basin">
        <span class="label">Plains Defense</span>
        <span class="reveal"><span class="inner">
          <img src="/src/menu/plains.webp" alt="" width="640" height="360" decoding="async" />
          <span class="foot"><em>Open ground. The swarm comes from every side.</em><strong>DEPLOY</strong></span>
        </span></span>
      </button>
      <button class="map" type="button" data-map="canyon">
        <span class="label">Canyon Siege</span>
        <span class="reveal"><span class="inner">
          <img src="/src/menu/canyon.webp" alt="" width="640" height="360" decoding="async" />
          <span class="foot"><em>One way in. Hold the choke as the horde marches up the canyon.</em><strong>DEPLOY</strong></span>
        </span></span>
      </button>
    </div>
  </div>
  <div id="skip">PRESS ANY KEY TO SKIP</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
